name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for PDF export
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build sample report end to end (offline writer, no API key needed)
        run: PYTHONPATH=src python -m ai_report.cli --data data/sample/orders.csv --provider offline --out ci-output

      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: ci-output/
